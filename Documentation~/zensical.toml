# Zensical configuration (replaces the old MkDocs mkdocs.yml).
# Docs are built with the shared `side-xp` theme: https://github.com/side-xp/py-zensical-theme

[project]
site_name = "SideXP - Selection (Unity)"
site_description = "A utility window that allow selection presets and navigation."
site_author = "Sideways Experiments"
repo_url = "https://github.com/side-xp/unity-selection"
copyright = """
&copy; 2026 <a href="https://sideways-experiments.com">Sideways Experiments</a>
"""

# Source MarkDown files and generated website output. Both are resolved relative to this file.
docs_dir = "."
site_dir = "site"

[project.theme]
name = "side-xp"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

# Sidebar order is defined in .nav.yml (keeps the generated API reference last).
# Built into Zensical, nothing to install: https://zensical.org/docs/compatibility/mkdocs/plugins/
[project.plugins.awesome-nav]

# More about extensions: https://zensical.org/docs/setup/extensions/
